<div v-if="activeMenu === 'strm_records'">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin:0">STRM 生成记录库 (高速缓存)</h2>
        <el-button type="danger" plain @click="clearStrmRecords">
            清空当前节点记录并重建缓存
        </el-button>
    </div>

    <el-alert
        title="提示: 增量更新会优先从当前节点的记录缓存中比对，减少网盘重复扫描。切换节点可单独查看、单独清理缓存。"
        type="success"
        style="margin-bottom: 20px;">
    </el-alert>

    <el-tabs v-model="activeRecordConfigId" type="border-card" @tab-change="handleRecordTabChange">
        <el-tab-pane name="all">
            <template #label>
                全部节点 ({{ getRecordSummaryCount('all') }})
            </template>
        </el-tab-pane>
        <el-tab-pane
            v-for="node in recordSummaries"
            :key="node.id"
            :name="String(node.id)">
            <template #label>
                {{ node.config_name || ('节点 ' + node.id) }} ({{ node.record_count || 0 }})
            </template>
        </el-tab-pane>

        <el-table :data="strmRecords" stripe border>
            <el-table-column prop="config_name" label="所属节点" width="180"></el-table-column>
            <el-table-column prop="file_name" label="文件名" width="320"></el-table-column>
            <el-table-column prop="local_path" label="本地映射相对路径"></el-table-column>
            <el-table-column prop="created_at" label="生成入库时间" width="180"></el-table-column>
        </el-table>

        <div style="margin-top: 20px; display: flex; justify-content: center;">
            <el-pagination
                background
                layout="total, prev, pager, next"
                :total="recordTotal"
                :page-size="recordPageSize"
                v-model:current-page="recordPage"
                @current-change="loadStrmRecords">
            </el-pagination>
        </div>
    </el-tabs>
</div>
