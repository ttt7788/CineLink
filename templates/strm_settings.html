<div class="strm-settings-grid">
    <section class="strm-section">
        <div class="section-head compact">
            <div>
                <h3>媒体生成规则</h3>
                <p>控制 STRM 扫描放行格式、元数据下载和并发线程。</p>
            </div>
        </div>
        <el-form label-position="top">
            <el-row :gutter="20">
                <el-col :span="12">
                    <el-form-item label="视频格式放行规则">
                        <el-input v-model="strmSettings.video_formats" placeholder="mp4,mkv,avi,mov,flv,wmv,ts,m2ts"></el-input>
                    </el-form-item>
                </el-col>
                <el-col :span="12">
                    <el-form-item label="字幕格式放行">
                        <el-input v-model="strmSettings.subtitle_formats" placeholder="srt,ass,sub"></el-input>
                    </el-form-item>
                </el-col>
            </el-row>
            <el-row :gutter="20">
                <el-col :span="12">
                    <el-form-item label="图片格式放行">
                        <el-input v-model="strmSettings.image_formats" placeholder="jpg,png,bmp"></el-input>
                    </el-form-item>
                </el-col>
                <el-col :span="12">
                    <el-form-item label="元数据格式放行">
                        <el-input v-model="strmSettings.metadata_formats" placeholder="nfo"></el-input>
                    </el-form-item>
                </el-col>
            </el-row>
            <el-row :gutter="20">
                <el-col :span="12">
                    <el-form-item label="体积过滤阈值">
                        <el-input-number v-model="strmSettings.size_threshold" :min="0" style="width: 100%"></el-input-number>
                    </el-form-item>
                </el-col>
                <el-col :span="12">
                    <el-form-item label="并发拉取网络线程数">
                        <el-input-number v-model="strmSettings.download_threads" :min="1" :max="32" style="width: 100%"></el-input-number>
                    </el-form-item>
                </el-col>
            </el-row>
            <el-button type="primary" size="large" @click="saveStrmSettings">保存所有全局规则</el-button>
        </el-form>
    </section>

    <section class="strm-section">
        <div class="section-head compact">
            <div>
                <h3>域名一键修复</h3>
                <p>批量替换已生成 STRM 文件里的播放地址。</p>
            </div>
        </div>
        <el-form label-position="top">
            <el-form-item label="要处理的本地 STRM 物理根目录">
                <el-input v-model="replaceTool.target_directory" placeholder="/data/media"></el-input>
            </el-form-item>
            <el-form-item label="旧域名/IP">
                <el-input v-model="replaceTool.old_domain" placeholder="http://192.168.1.100:5244"></el-input>
            </el-form-item>
            <el-form-item label="新域名/IP">
                <el-input v-model="replaceTool.new_domain" placeholder="https://strm.mydomain.com"></el-input>
            </el-form-item>
            <el-button type="warning" size="large" @click="runReplaceDomain">
                <el-icon><MagicStick></MagicStick></el-icon>
                在后台执行替换作业
            </el-button>
        </el-form>
    </section>
</div>
